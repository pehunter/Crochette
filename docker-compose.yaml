services:
  sessions:
    build: user-session
    ports:
      - 3000:8080
    depends_on:
      postgresql:
        condition: service_healthy

  
  postgresql:
    image: postgres:latest
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - 127.0.0.1:5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mydb"]
      interval: 5s
      retries: 10
      timeout: 3s
      start_period: 10s