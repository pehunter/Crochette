services:
  sessions:
    build:
      context: .
      dockerfile: user-session/Dockerfile
    env_file:
      - .env
    ports:
      - 3000:8080
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy

  userinfo:
    build:
      context: .
      dockerfile: user-info/Dockerfile
    env_file:
      - .env
    ports:
      - 3001:8080
    depends_on:
      postgresql:
        condition: service_healthy

  postgresql:
    image: postgres:latest
    env_file:
      - .env
    ports:
      - 127.0.0.1:5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mydb"]
      interval: 5s
      retries: 10
      timeout: 3s
      start_period: 10s
  
  redis:
    image: redis:latest
    env_file:
      - .env
    ports:
      - 127.0.0.1:6379:6379
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      retries: 10
      timeout: 3s
      start_period: 10s